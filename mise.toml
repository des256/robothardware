# Hardware workspace env - vendored helpers on PATH per kevins-kicad-helpers README.
# Tools mirror the submodule's own mise.toml so kkh scripts run from this directory.
[tools]
"github:babashka/babashka" = "1.12.218"
"github:weavejester/cljfmt" = "0.16.4"
uv = "latest"

[env]
_.path = ["{{config_root}}/vendor/kevins-kicad-helpers/bin"]
# kkh's kicad-python shim falls back to whatever python3 is on PATH; here that is
# PlatformIO's venv, which cannot import pcbnew. Point it at the system KiCad python.
KICAD_PYTHON = "/usr/bin/python3"
